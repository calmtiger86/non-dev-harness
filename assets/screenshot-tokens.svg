<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380">
  <defs>
    <linearGradient id="tbg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d2d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="tb2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a"/>
      <stop offset="100%" style="stop-color:#2d2d2d"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="380" rx="10" fill="url(#tbg2)"/>
  <rect width="800" height="36" rx="10" fill="url(#tb2)"/>
  <rect y="26" width="800" height="10" fill="url(#tb2)"/>

  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>
  <text x="400" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#999">Token Optimization — Measured Results</text>

  <!-- Header -->
  <text x="40" y="70" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="13" fill="#64ffda">  상시 컨텍스트 비교</text>

  <!-- Bar: No harness -->
  <text x="40" y="105" font-family="'SF Mono', monospace" font-size="12" fill="#8892b0">  하네스 없이 (매번 재설명)</text>
  <rect x="300" y="92" width="420" height="20" rx="4" fill="#333"/>
  <rect x="300" y="92" width="420" height="20" rx="4" fill="#e94560" opacity="0.7"/>
  <text x="730" y="107" text-anchor="end" font-family="'SF Mono', monospace" font-size="12" font-weight="700" fill="#fff">~5,000 tok</text>

  <!-- Bar: OMC full -->
  <text x="40" y="140" font-family="'SF Mono', monospace" font-size="12" fill="#8892b0">  OMC 풀시스템</text>
  <rect x="300" y="127" width="420" height="20" rx="4" fill="#333"/>
  <rect x="300" y="127" width="360" height="20" rx="4" fill="#ffcb6b" opacity="0.5"/>
  <text x="668" y="142" text-anchor="end" font-family="'SF Mono', monospace" font-size="12" font-weight="700" fill="#fff">~5,200 tok</text>

  <!-- Bar: non-dev-harness -->
  <text x="40" y="175" font-family="'SF Mono', monospace" font-size="12" fill="#c3e88d">  non-dev-harness</text>
  <rect x="300" y="162" width="420" height="20" rx="4" fill="#333"/>
  <rect x="300" y="162" width="97" height="20" rx="4" fill="url(#bar1)"/>
  <text x="410" y="177" font-family="'SF Mono', monospace" font-size="12" font-weight="700" fill="#c3e88d">~1,150 tok</text>

  <!-- Savings callout -->
  <rect x="300" y="195" width="200" height="26" rx="6" fill="#64ffda" opacity="0.12" stroke="#64ffda" stroke-width="1"/>
  <text x="400" y="213" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" fill="#64ffda">78% lighter</text>

  <!-- Divider -->
  <rect x="40" y="240" width="720" height="1" fill="#333"/>

  <!-- Savings -->
  <text x="40" y="270" font-family="'SF Mono', monospace" font-size="13" fill="#64ffda">  세션당 절약 효과</text>

  <rect x="60" y="285" width="320" height="36" rx="8" fill="#e94560" opacity="0.12" stroke="#e94560" stroke-width="1"/>
  <text x="220" y="300" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" fill="#f78da7">하네스 없이 매번 재설명</text>
  <text x="220" y="315" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" fill="#8892b0">~5,000 tok x 매 세션</text>

  <text x="405" y="308" font-family="system-ui, sans-serif" font-size="16" fill="#555">→</text>

  <rect x="430" y="285" width="320" height="36" rx="8" fill="#64ffda" opacity="0.12" stroke="#64ffda" stroke-width="1"/>
  <text x="590" y="300" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" fill="#64ffda">하네스 사용 (자동 복원)</text>
  <text x="590" y="315" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" fill="#8892b0">~1,150 tok (상시)</text>

  <!-- Bottom line -->
  <rect x="40" y="340" width="720" height="1" fill="#333"/>
  <text x="400" y="365" text-anchor="middle" font-family="'SF Mono', monospace" font-size="12" fill="#64ffda">세션 3회 기준: 15,000 → 1,150 토큰. 매 세션 ~77% 절약.</text>
</svg>
